version: '3.8'

services:
  # Django Backend
  web:
    image: ghcr.io/${GITHUB_USERNAME}/vivaclub:latest
    container_name: vivaclub_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
      - minio
      - livekit
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - static_files:/app/staticfiles
    networks:
      - vivaclub_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vivaclub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vivaclub
      POSTGRES_USER: vivaclub
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vivaclub_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vivaclub" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vivaclub_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - vivaclub_network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO (Image Storage)
  minio:
    image: minio/minio:latest
    container_name: vivaclub_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - vivaclub_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # LiveKit Server (Audio Streaming)
  livekit:
    image: livekit/livekit-server:latest
    container_name: vivaclub_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    networks:
      - vivaclub_network

  # Monitoring - cAdvisor
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: vivaclub_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - vivaclub_network
    privileged: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  static_files:


networks:
  vivaclub_network:
    driver: bridge
