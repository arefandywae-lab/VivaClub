<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VivaClub - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F7FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: #4FD1C5; /* VivaClub Primary Color */
            margin-bottom: 1rem;
        }
        h2 { margin-bottom: 0.5rem; color: #2D3748; }
        p { color: #718096; margin-bottom: 2rem; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1.5rem;
            border: 1px solid #E2E8F0;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4FD1C5; }
        button {
            width: 100%;
            padding: 12px;
            background: #4FD1C5;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .success { color: #48BB78; font-weight: 600; }
        .error { color: #F56565; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">VivaClub</div>
        <h2>Create New Password</h2>
        <p>Enter a secure password for your account.</p>
        
        <form id="resetForm">
            <input type="hidden" id="token" value="{{ token }}">
            <input type="password" id="password" placeholder="New Password" required minlength="8">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="8">
            <div id="message"></div>
            <button type="submit" id="submitBtn">Reset Password</button>
        </form>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = document.getElementById('token').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            if (password !== confirmPassword) {
                messageDiv.innerHTML = '<p class="error">Passwords do not match</p>';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Resetting...';

            try {
                const response = await fetch('/api/auth/reset-password/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });

                const data = await response.json();
                if (response.ok) {
                    messageDiv.innerHTML = '<p class="success">Password reset successfully! You can now login to the app.</p>';
                    document.getElementById('password').style.display = 'none';
                    document.getElementById('confirmPassword').style.display = 'none';
                    submitBtn.style.display = 'none';
                } else {
                    messageDiv.innerHTML = `<p class="error">${data.error || 'Reset failed'}</p>`;
                    submitBtn.disabled = false;
                    submitBtn.innerText = 'Reset Password';
                }
            } catch (err) {
                messageDiv.innerHTML = '<p class="error">An error occurred. Please try again.</p>';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Reset Password';
            }
        });
    </script>
</body>
</html>
