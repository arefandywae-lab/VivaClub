name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vivaclub:latest
            ghcr.io/${{ github.repository_owner }}/vivaclub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "🔄 Starting deployment..."
            cd ~/vivaclub
            
            # Pull latest image
            echo "📦 Pulling latest Docker image..."
            docker pull ghcr.io/${{ github.repository_owner }}/vivaclub:latest
            
            # Update environment if needed
            echo "⚙️ Updating environment..."
            echo "${{ secrets.ENV_PRODUCTION }}" > .env.production
            
            # Restart services with zero-downtime
            echo "🔄 Restarting services..."
            docker-compose -f docker-compose.prod.yml up -d --no-deps --build web
            
            # Run migrations
            echo "🗄️ Running database migrations..."
            docker exec vivaclub_web python manage.py migrate --noinput
            
            # Collect static files
            echo "📁 Collecting static files..."
            docker exec vivaclub_web python manage.py collectstatic --noinput
            
            # Cleanup old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af
            
            echo "✅ Deployment completed successfully!"

      - name: 🏥 Health check
        run: |
          echo "⏳ Waiting for services to start..."
          sleep 15
          
          echo "🏥 Checking API health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ secrets.DOMAIN }}/api/health || echo "000")
          
          if [ "$response" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed! HTTP $response"
            exit 1
          fi

      - name: 📊 Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date)" >> $GITHUB_STEP_SUMMARY

      - name: 💬 Notify on failure
        if: failure()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "❌ Deployment failed! Rolling back..."
            cd ~/vivaclub
            docker-compose -f docker-compose.prod.yml logs --tail=100 web
