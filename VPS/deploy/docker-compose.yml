services:
  # 1. Reverse Proxy (Handles HTTPS automatically)
  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/mediafiles
    networks:
      - vivanet

  # 2. Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: vivaclub_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vivanet

  # 3. Cache & Message Broker (Redis)
  redis:
    image: redis:7-alpine
    container_name: vivaclub_redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-viva-redis-pass}" ]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - vivanet

  # 4. Backend (Django)
  backend:
    build:
      context: ../../Server
      dockerfile: Dockerfile
    container_name: vivaclub_backend
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-vivaclub_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vivaclub}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
      - redis
    networks:
      - vivanet

  # 5. LiveKit Server (WebRTC SFU)
  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit_server
    restart: unless-stopped
    network_mode: "host" # Host network is STRONGLY RECOMMENDED for WebRTC performance
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml

  # 6. Database Dashboard (Adminer)
  adminer:
    image: adminer:latest
    container_name: vivaclub_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - vivanet

  # 7. Server & Docker Dashboard (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - vivanet

  # 8. Real-time Log Viewer (Dozzle)
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - vivanet

  # 9. Next.js Web Dashboard
  dashboard:
    build:
      context: ../../web-dashboard
      dockerfile: Dockerfile
    container_name: vivaclub_dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.vivaclubs.site
      - NEXT_PUBLIC_WS_URL=wss://api.vivaclubs.site
    depends_on:
      - backend
    networks:
      - vivanet

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  static_volume:
  media_volume:
  portainer_data:


networks:
  vivanet:
    driver: bridge
